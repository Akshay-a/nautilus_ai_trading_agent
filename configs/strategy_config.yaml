# DeepSeek AI Strategy Configuration for NautilusTrader

strategy:
  name: "DeepSeekAIStrategy"
  instrument_id: "BTCUSDT-LINEAR.BYBIT"

  # Bar configuration
  bar_type: "BTCUSDT-LINEAR.BYBIT-5-MINUTE-LAST-EXTERNAL"  # Production default: 5-minute bars

  # Capital and leverage
  equity: 100000  # USDT reference equity for sizing caps
  leverage: 20

  # Position sizing
  position_management:
    base_usdt_amount: 2500  # Fallback margin capital when fixed_trade_usdt is disabled
    fixed_trade_usdt: 2500  # Fixed margin capital per protected entry; notional = margin * leverage
    high_confidence_multiplier: 1.5
    medium_confidence_multiplier: 1.0
    low_confidence_multiplier: 0.5
    max_position_ratio: 20.0  # Notional cap as equity multiple; margin*leverage remains the primary limiter
    trend_strength_multiplier: 1.2
    min_trade_amount: 0.001  # Minimum BTC amount

  # Technical indicators parameters - Standard periods (works with default 5m bars)
  indicators:
    sma_periods: [5, 20, 50]  # Standard SMA periods
    ema_periods: [12, 26]     # Standard EMA periods for MACD
    rsi_period: 14            # Standard RSI period
    macd_fast: 12             # Standard MACD fast period
    macd_slow: 26             # Standard MACD slow period
    macd_signal: 9            # Standard MACD signal period
    bollinger_period: 20      # Standard Bollinger Band period
    bollinger_std: 2.0
    volume_ma_period: 20      # Standard volume MA period
    support_resistance_lookback: 48  # Wider structural S/R (~H4 on 5m bars)

  # AI configuration
  deepseek:
    model: "deepseek-reasoner"
    temperature: 0.1
    max_retries: 2
    base_url: "https://api.deepseek.com"
    kline_context_bars: 20          # Number of recent bars included in LLM analysis context

  # Sentiment data
  sentiment:
    enabled: true
    provider: "cryptoracle"
    update_interval_minutes: 15
    lookback_hours: 4
    weight: 0.30  # 30% weight in decision making

  # Risk management
  risk:
    min_confidence_to_trade: "MEDIUM"  # LOW, MEDIUM, HIGH
    max_consecutive_same_signal: 5
    rsi_extreme_threshold_upper: 75
    rsi_extreme_threshold_lower: 25
    rsi_extreme_multiplier: 0.7
    
    # Stop Loss & Take Profit — move-capture targets
    enable_auto_sl_tp: true
    sl_use_support_resistance: true
    sl_buffer_pct: 0.001
    tp_high_confidence_pct: 0.03    # 3.0% target when structure allows
    tp_medium_confidence_pct: 0.02  # 2.0%
    tp_low_confidence_pct: 0.01     # 1.0%
    min_entry_rr: 0.5       # Block new entries if structural TP offers less than 0.5R
    default_target_r: 1.0   # LLM may request 0.5R, 0.75R, 1R, 2R, or 3R
    max_target_r: 3.0
    
    # OCO (One-Cancels-the-Other) Management
    enable_oco: true  # 启用 OCO 自动取消机制
    oco_redis_host: "localhost"  # Redis 服务器地址
    oco_redis_port: 6379  # Redis 端口
    oco_redis_db: 0  # Redis 数据库编号
    oco_redis_password: null  # Redis 密码 (如果需要)
    oco_group_ttl_hours: 24  # OCO 组过期时间（小时）
    
    # Trailing Stop Loss — move-capture; activates only after meaningful MFE
    enable_trailing_stop: true
    trailing_activation_pct: 0.01    # Activate after +1% profit
    trailing_distance_pct: 0.005     # Trail 0.5% behind price
    trailing_update_threshold_pct: 0.002  # Update on 0.2% moves
    
    # Partial Take Profit disabled for v1 to avoid repeated exposure decay
    enable_partial_tp: false
    partial_tp_levels: []

  # Decision layer
  decision_layer:
    enable_market_state_gate: true  # Call LLM only on material regime/structure/microstructure changes

  # Telegram Notifications (Telegram 通知)
  telegram:
    enabled: true  # 启用 Telegram 通知 (配置后设为 true)
    bot_token: ""  # Bot Token (从 .env 读取 TELEGRAM_BOT_TOKEN)
    chat_id: ""    # Chat ID (从 .env 读取 TELEGRAM_CHAT_ID)
    
    # 通知类型控制
    notify_signals: true      # 通知交易信号
    notify_fills: true        # 通知订单成交
    notify_positions: true    # 通知持仓变化
    notify_errors: true       # 通知错误

  # Execution
  execution:
    order_type: "MARKET"
    time_in_force: "GTC"
    reduce_only_for_closes: true
    position_adjustment_threshold: 0.001  # Min 0.001 BTC difference to adjust

  # Order Book / Microstructure
  orderbook:
    enabled: true                    # Subscribe to L2 depth + trade ticks
    depth_levels: 10                 # Top N levels to track
    depth_buffer_size: 300           # Ring buffer for raw depth snapshots
    trade_buffer_size: 5000          # Ring buffer for trade ticks
    feature_buffer_size: 500         # Ring buffer for computed feature vectors
    ema_alpha: 0.05                  # EMA smoothing for feature series
    trade_window_sec: 300            # Rolling trade-flow window (seconds)
    log_interval: 600                # Log summary every N depth updates (count-based)
    log_min_seconds: 60              # Additional wall-clock throttle: max one OB summary per minute

  # Timing
  timer_interval_sec: 300   # 5-minute decision cycle (aligns with default TIMEFRAME=5m)
  warmup_bars: 500         # Historical bars fetched at startup (Bybit API cap: 1000)

# Logging configuration
logging:
  log_level: "INFO"
  log_to_file: true
  log_file: "logs/deepseek_strategy.log"
  log_signals: true
  log_positions: true
  log_ai_responses: true
